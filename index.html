<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier Maya — PLAI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#e91e8c; --pink-d:#c2166e;
  --dark:#111827; --slate:#374151; --gray:#6b7280;
  --light:#f9fafb; --white:#fff;
  --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  --shadow:0 4px 24px rgba(0,0,0,.08);
  --r:14px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--light);min-height:100vh;color:var(--dark)}

/* ── HEADER ── */
.hdr{background:var(--dark);padding:10px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:300}
.hdr-logo{height:44px;object-fit:contain}
.hdr-title{color:#fff;font-size:1rem;font-weight:700}
.hdr-title em{color:var(--pink);font-style:normal}

/* ── SCREENS ── */
.screen{display:none}
.screen.on{display:block}

/* ── CONFIG ── */
.cfg-wrap{max-width:700px;margin:36px auto;padding:0 20px}
.cfg-card{background:#fff;border-radius:var(--r);padding:32px;box-shadow:var(--shadow)}
.cfg-h1{font-size:1.4rem;font-weight:900;margin-bottom:4px}
.cfg-sub{color:var(--gray);font-size:.84rem;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid #e5e7eb}
.fld{margin-bottom:24px}
.lbl{display:block;font-weight:700;font-size:.84rem;color:var(--slate);margin-bottom:8px}
.lbl small{font-weight:400;color:var(--gray);margin-left:6px}
.sld-row{display:flex;align-items:center;gap:12px}
.sld-row input[type=range]{flex:1;accent-color:var(--pink);cursor:pointer;height:6px}
.sld-val{background:var(--pink);color:#fff;font-weight:900;font-size:1rem;min-width:38px;text-align:center;padding:4px 8px;border-radius:8px}
.ci-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:4px}
.ci-row{display:flex;flex-direction:column;gap:3px}
.ci-row label{font-size:.71rem;color:var(--gray);font-weight:600}
.ci-row input{border:2px solid #e5e7eb;border-radius:8px;padding:8px 10px;font-size:.94rem;font-weight:700;text-align:center;color:var(--dark);transition:border-color .15s}
.ci-row input:focus{outline:none;border-color:var(--pink)}
.ci-row input.err{border-color:var(--red);background:#fef2f2}
.btn-surprise{margin-top:10px;background:transparent;border:2px dashed #d1d5db;color:var(--gray);padding:7px 16px;border-radius:8px;font-size:.82rem;cursor:pointer;transition:all .15s}
.btn-surprise:hover{border-color:var(--pink);color:var(--pink)}
.tgl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgl-opt{display:flex;align-items:center;justify-content:space-between;background:var(--light);border-radius:10px;padding:12px 14px;gap:10px}
.tgl-opt .tl{font-size:.84rem;font-weight:700;color:var(--slate)}
.tgl-opt .ts{font-size:.71rem;color:var(--gray)}
.sw{position:relative;width:44px;height:24px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw-track{position:absolute;inset:0;background:#d1d5db;border-radius:24px;cursor:pointer;transition:background .2s}
.sw-track::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+.sw-track{background:var(--pink)}
.sw input:checked+.sw-track::before{transform:translateX(20px)}
.btn-launch{width:100%;padding:15px;background:var(--pink);color:#fff;border:none;border-radius:12px;font-size:1.05rem;font-weight:800;cursor:pointer;margin-top:22px;transition:background .15s,transform .1s}
.btn-launch:hover{background:var(--pink-d)}
.btn-launch:active{transform:scale(.98)}

/* ── ACTIVITY ── */
.act-wrap{max-width:1000px;margin:0 auto;padding:20px 20px 40px}
.act-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.act-title{font-size:1rem;font-weight:700;color:var(--slate)}

/* timer */
.timer{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--green);border-radius:12px;padding:8px 20px;font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--green);letter-spacing:3px;transition:color .4s,border-color .4s;background:#fff}
.timer.warn{color:var(--amber);border-color:var(--amber)}
.timer.danger{color:var(--red);border-color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* line section */
.line-sec{background:#fff;border-radius:var(--r);padding:16px 16px 12px;box-shadow:var(--shadow);margin-bottom:20px}
#lsc{position:relative;width:100%;overflow:visible;min-height:280px}

/* connector from placed card down to the graduation */
.mc-conn{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:2px;background:#cbd5e1;pointer-events:none;border-radius:0 0 1px 1px}
.mc-conn::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid #cbd5e1}
.mc.ok .mc-conn{background:#16a34a}
.mc.ok .mc-conn::after{border-top-color:#16a34a}
.mc.ko .mc-conn{background:#dc2626}
.mc.ko .mc-conn::after{border-top-color:#dc2626}

/* card pool */
.pool{background:#f3f4f6;border-radius:12px;border:2px dashed #e5e7eb;padding:16px;min-height:100px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.pool-lbl{width:100%;text-align:center;font-size:.77rem;color:var(--gray);font-weight:600;pointer-events:none}

/* maya card */
.mc{background:#fff;border:3px solid #e5e7eb;border-radius:12px;padding:7px;cursor:grab;position:relative;transition:border-color .25s,box-shadow .15s;user-select:none;touch-action:none;flex-shrink:0}
.op-expr{display:flex;align-items:center;gap:4px}
.op-sym{font-size:1.4rem;font-weight:900;color:#1e293b;flex-shrink:0;line-height:1}
.mc:hover:not(.locked){box-shadow:0 4px 14px rgba(0,0,0,.14);border-color:var(--pink)}
.mc.placed{position:absolute;cursor:grab;z-index:10}
.mc.ok{border-color:var(--green)!important;background:#f0fdf4}
.mc.ko{border-color:var(--red)!important;background:#fef2f2}
.mc.locked{cursor:default;pointer-events:none}

/* hint */
.hb{position:absolute;top:-10px;right:-10px;width:22px;height:22px;background:var(--pink);color:#fff;border:none;border-radius:50%;font-size:.68rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20;transition:transform .15s}
.hb:hover{transform:scale(1.25)}
.ho{position:absolute;inset:0;background:rgba(233,30,140,.92);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.7rem;font-weight:900;z-index:15;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}

/* drop indicator */
#di{position:absolute;width:3px;background:var(--pink);border-radius:2px;pointer-events:none;transform:translateX(-50%);display:none;z-index:50;box-shadow:0 0 6px var(--pink)}

/* action bar */
.act-bar{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn-val{padding:12px 28px;background:var(--dark);color:#fff;border:none;border-radius:10px;font-size:.94rem;font-weight:700;cursor:pointer;transition:background .15s}
.btn-val:hover{background:var(--slate)}
.btn-fin{padding:12px 28px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:.94rem;font-weight:700;cursor:pointer;display:none;animation:fi .4s}
.btn-back{padding:10px 20px;background:transparent;color:var(--gray);border:2px solid #e5e7eb;border-radius:10px;font-size:.87rem;cursor:pointer;transition:all .15s}
.btn-back:hover{border-color:var(--pink);color:var(--pink)}

/* ── BILAN ── */
.bil-wrap{max-width:600px;margin:36px auto;padding:0 20px}
.bil-card{background:#fff;border-radius:var(--r);padding:32px;box-shadow:var(--shadow)}
.bil-hd{text-align:center;margin-bottom:24px}
.bil-ico{font-size:2.6rem}
.bil-h1{font-size:1.3rem;font-weight:900;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.sbox{background:var(--light);border-radius:12px;padding:16px;text-align:center}
.sv{font-size:1.7rem;font-weight:900;color:var(--pink)}
.sl{font-size:.71rem;color:var(--gray);font-weight:600;margin-top:4px}
.riss{background:#fdf2f8;border-left:4px solid var(--pink);border-radius:0 10px 10px 0;padding:14px 16px;font-size:.77rem;color:var(--slate);margin-top:18px;line-height:1.6}
.riss strong{display:block;color:var(--pink);font-size:.67rem;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.riss p+p{margin-top:8px}
.btn-restart{width:100%;padding:14px;background:var(--pink);color:#fff;border:none;border-radius:12px;font-size:.94rem;font-weight:700;cursor:pointer;margin-top:18px;transition:background .15s}
.btn-restart:hover{background:var(--pink-d)}
.sb-st{text-align:center;font-size:.8rem;color:var(--gray);min-height:1.4em;margin:10px 0 2px}
.fld-code input{width:100%;border:2px solid #e5e7eb;border-radius:8px;padding:8px 12px;font-size:.94rem;color:var(--dark);transition:border-color .15s}
.fld-code input:focus{outline:none;border-color:var(--pink)}
.btn-copy{width:100%;padding:11px;background:transparent;color:var(--gray);border:2px solid #e5e7eb;border-radius:12px;font-size:.84rem;cursor:pointer;margin-top:8px;transition:all .15s}
.btn-copy:hover{border-color:var(--slate);color:var(--slate)}

@media(max-width:580px){
  .tgl-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .timer{font-size:1.4rem;padding:6px 14px}
}
</style>
</head>
<body>

<header class="hdr">
  <img class="hdr-logo" src="https://raw.githubusercontent.com/jfb4plai/Picto-lecture/main/public/nouveau_logo_plai_(1).jpg" alt="Logo PLAI">
  <span class="hdr-title"><em>Atelier</em> Maya</span>
</header>

<!-- ══════════ CONFIG ══════════ -->
<section id="s-cfg" class="screen on">
  <div class="cfg-wrap">
    <div class="cfg-card">
      <div class="cfg-h1">⚙️ Configuration — Animateur</div>
      <div class="cfg-sub">Paramétrez l'activité avant de la projeter pour les participants</div>

      <div class="fld">
        <label class="lbl">Nombre de cartes <small>(2 – 8)</small></label>
        <div class="sld-row">
          <input type="range" id="nb" min="2" max="8" value="4" oninput="syncNb()">
          <div class="sld-val" id="nb-v">4</div>
        </div>
      </div>

      <div class="fld">
        <label class="lbl">Valeurs <small>(nombres ou expressions : -7 · 4-8 · 2*5)</small></label>
        <div class="ci-grid" id="ci-grid"></div>
        <button class="btn-surprise" onclick="surprise()">🎲 Surprise !</button>
      </div>

      <div class="fld">
        <label class="lbl">Options</label>
        <div class="tgl-grid">
          <label class="tgl-opt">
            <div><div class="tl">⏱ Chronomètre</div><div class="ts">Pression temporelle visible</div></div>
            <label class="sw"><input type="checkbox" id="o-timer" checked><div class="sw-track"></div></label>
          </label>
          <label class="tgl-opt">
            <div><div class="tl">💡 Aide (indice)</div><div class="ts">Bouton sur chaque carte</div></div>
            <label class="sw"><input type="checkbox" id="o-hint" checked><div class="sw-track"></div></label>
          </label>
          <label class="tgl-opt">
            <div><div class="tl">✅ Validation</div><div class="ts">Vérification progressive</div></div>
            <label class="sw"><input type="checkbox" id="o-val" checked><div class="sw-track"></div></label>
          </label>
          <label class="tgl-opt">
            <div><div class="tl">🖥️ Mode partagé</div><div class="ts">Un écran pour le groupe</div></div>
            <label class="sw"><input type="checkbox" id="o-shared"><div class="sw-track"></div></label>
          </label>
        </div>
      </div>

      <div class="fld fld-code">
        <label class="lbl">Code session <small>(optionnel — regroupe les résultats d'une même formation)</small></label>
        <input type="text" id="o-code" placeholder="ex. PLAI-mars-2026" autocomplete="off">
      </div>

      <button class="btn-launch" onclick="launch()">Lancer l'activité →</button>
    </div>
  </div>
</section>

<!-- ══════════ ACTIVITÉ ══════════ -->
<section id="s-act" class="screen">
  <div class="act-wrap">
    <div class="act-top">
      <div class="act-title">🏺 Placez chaque symbole Maya sur la droite graduée</div>
      <div id="timer" class="timer">⏱ 00:00</div>
      <button class="btn-back" onclick="goConfig()">← Config</button>
    </div>

    <div class="line-sec">
      <div id="lsc">
        <div id="di"></div>
      </div>
    </div>

    <div class="pool" id="pool">
      <div class="pool-lbl" id="pool-lbl">Faites glisser les cartes sur la droite graduée</div>
    </div>

    <div class="act-bar">
      <button class="btn-val" id="btn-val" onclick="validate()">✅ Vérifier</button>
      <button class="btn-fin" id="btn-fin" onclick="goBilan()">🎉 Terminer</button>
    </div>
  </div>
</section>

<!-- ══════════ BILAN ══════════ -->
<section id="s-bil" class="screen">
  <div class="bil-wrap">
    <div class="bil-card">
      <div class="bil-hd">
        <div class="bil-ico">🎯</div>
        <div class="bil-h1">Bilan de l'activité</div>
      </div>
      <div class="stats" id="bil-stats"></div>
      <div class="riss" id="bil-riss"></div>
      <div class="sb-st" id="sb-status"></div>
      <button class="btn-copy" onclick="copyBilan()">📋 Copier le résumé</button>
      <button class="btn-restart" onclick="goConfig()">↺ Nouvelle activité</button>
    </div>
  </div>
</section>

<script>
/* ══════════════════════════════════════════
   MAYA RENDERER
══════════════════════════════════════════ */
function mayaDigit(n, cx, sy, sh) {
  const f = '#1e293b', r = [];
  if (n === 0) {
    const ey = sy + sh / 2;
    r.push(`<ellipse cx="${cx}" cy="${ey}" rx="11" ry="7" fill="none" stroke="${f}" stroke-width="2.5"/>`);
    r.push(`<circle cx="${cx}" cy="${ey}" r="2.5" fill="${f}"/>`);
    return r.join('');
  }
  const bars = Math.floor(n / 5), dots = n % 5;
  const bH = 8, bW = 42, bG = 4, dR = 4.5, dG = 5, sG = 7;
  const bsH = bars > 0 ? bars * bH + (bars - 1) * bG : 0;
  const dsH = dots > 0 ? dR * 2 : 0;
  const tot = dsH + (dots > 0 && bars > 0 ? sG : 0) + bsH;
  let y = sy + (sh - tot) / 2;
  if (dots > 0) {
    const tw = dots * (dR * 2) + (dots - 1) * dG;
    const sx = cx - tw / 2 + dR;
    for (let d = 0; d < dots; d++)
      r.push(`<circle cx="${+(sx + d * (dR * 2 + dG)).toFixed(1)}" cy="${+(y + dR).toFixed(1)}" r="${dR}" fill="${f}"/>`);
    y += dsH; if (bars > 0) y += sG;
  }
  for (let b = 0; b < bars; b++) {
    r.push(`<rect x="${+(cx - bW / 2).toFixed(1)}" y="${+y.toFixed(1)}" width="${bW}" height="${bH}" rx="2.5" fill="${f}"/>`);
    y += bH + (b < bars - 1 ? bG : 0);
  }
  return r.join('');
}

function mayaSVG(n, h = 72) {
  const neg = n < 0, abs = Math.abs(n);
  const w = neg ? 80 : 62;
  const cx = neg ? 50 : 31;
  const tw = Math.floor(abs / 20), un = abs % 20;
  const half = Math.floor(h / 2);
  let c = '';
  if (tw > 0) {
    c += mayaDigit(tw, cx, 2, half - 4);
    c += mayaDigit(un, cx, half + 4, half - 4);
  } else {
    c += mayaDigit(un, cx, 4, h - 8);
  }
  if (neg) {
    // Minus left side, vertically centred with the Maya numeral
    c += `<line x1="4" y1="${h/2}" x2="17" y2="${h/2}" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>`;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${c}</svg>`;
}

/* ══════════════════════════════════════════
   CONFIG
══════════════════════════════════════════ */
function syncNb() {
  const v = +document.getElementById('nb').value;
  document.getElementById('nb-v').textContent = v;
  buildInputs(v);
}

function buildInputs(n) {
  const grid = document.getElementById('ci-grid');
  const prev = [...grid.querySelectorAll('input')].map(i => i.value);
  grid.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'ci-row';
    d.innerHTML = `<label>Carte ${i + 1}</label>
      <input type="text" id="ci-${i}" placeholder="-7 ou 4-8" value="${prev[i] || ''}">`;
    grid.appendChild(d);
  }
}

function surprise() {
  const n = +document.getElementById('nb').value;
  const pool = [];
  while (pool.length < n) {
    const v = Math.floor(Math.random() * 27) - 13;
    if (!pool.includes(v)) pool.push(v);
  }
  for (let i = 0; i < n; i++) {
    const el = document.getElementById(`ci-${i}`);
    if (el) el.value = String(pool[i]);
  }
}

function parseOp(expr) {
  // Detect binary operations like "4-7", "2*5", "-3+5"
  // Distinguishes from plain negatives like "-7" (no match)
  const m = String(expr).trim().match(/^(-?\d+)\s*([+\-*/])\s*(\d+)$/);
  if (!m) return null;
  return { a: +m[1], op: m[2], b: +m[3] };
}

function cardHTML(c) {
  const op = parseOp(c.expr);
  if (op) {
    const sym = {'+': '+', '-': '−', '*': '×', '/': '÷'}[op.op];
    return `<div class="op-expr">${mayaSVG(op.a)}<span class="op-sym">${sym}</span>${mayaSVG(op.b)}</div>`;
  }
  return mayaSVG(c.val);
}

function safeEval(s) {
  try {
    const clean = s.replace(/[^0-9+\-*/().\s]/g, '');
    if (!clean.trim()) return null;
    const r = Function('"use strict";return(' + clean + ')')();
    return typeof r === 'number' && isFinite(r) ? Math.round(r) : null;
  } catch { return null; }
}

function launch() {
  const n = +document.getElementById('nb').value;
  const vals = []; let err = false;
  for (let i = 0; i < n; i++) {
    const inp = document.getElementById(`ci-${i}`);
    const v = safeEval(inp.value);
    if (v === null) { inp.classList.add('err'); err = true; }
    else { inp.classList.remove('err'); vals.push({ expr: inp.value, val: v }); }
  }
  if (err) return;
  cfg = {
    vals,
    timer: document.getElementById('o-timer').checked,
    hint:  document.getElementById('o-hint').checked,
    validate: document.getElementById('o-val').checked,
    shared: document.getElementById('o-shared').checked,
    sessionCode: document.getElementById('o-code').value.trim()
  };
  startActivity();
}

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let cfg = {};
let st  = {};
let lm  = {};
let ival = null;

function initState() {
  st = {
    cards: cfg.vals.map((v, i) => ({
      id: i, val: v.val, expr: v.expr,
      placed: false, at: null, ok: null, hints: 0
    })),
    sec: 0, valCount: 0, hints: 0, done: false
  };
}

function calcRange() {
  const nums = cfg.vals.map(v => v.val);
  const mn = Math.min(...nums), mx = Math.max(...nums);
  const pad = Math.max(3, Math.ceil((mx - mn) * .2) + 1);
  return { mn: Math.floor(mn - pad), mx: Math.ceil(mx + pad) };
}

/* ══════════════════════════════════════════
   ACTIVITY
══════════════════════════════════════════ */
function startActivity() {
  clearInterval(ival);
  initState();
  showScreen('s-act');

  lm.range = calcRange();

  const tel = document.getElementById('timer');
  if (!cfg.timer) {
    tel.style.display = 'none';
  } else {
    tel.style.display = 'inline-flex';
    tel.textContent = '⏱ 00:00'; tel.className = 'timer';
    ival = setInterval(tick, 1000);
  }

  document.getElementById('btn-val').style.display = cfg.validate ? 'inline-block' : 'none';
  document.getElementById('btn-fin').style.display = 'none';

  requestAnimationFrame(() => { renderLine(); renderPool(); });
}

function tick() {
  st.sec++;
  const tel = document.getElementById('timer');
  const mm = String(Math.floor(st.sec / 60)).padStart(2, '0');
  const ss = String(st.sec % 60).padStart(2, '0');
  tel.textContent = `⏱ ${mm}:${ss}`;
  tel.className = st.sec < 45 ? 'timer' : st.sec < 90 ? 'timer warn' : 'timer danger';
}

/* ── NUMBER LINE ── */
function renderLine() {
  const lsc = document.getElementById('lsc');
  const W = lsc.offsetWidth || 800;
  const H = 280, mL = 58, mR = 58, lineY = 215;
  const { mn, mx } = lm.range;
  const span = mx - mn;
  const upx = (W - mL - mR) / span;
  lm = { ...lm, W, H, mL, mR, lineY, upx, mn, mx };

  const labelEvery = span > 24 ? 5 : span > 12 ? 2 : 1;

  let s = `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<line x1="${mL}" y1="${lineY}" x2="${W-mR}" y2="${lineY}" stroke="#374151" stroke-width="3" stroke-linecap="round"/>`;
  s += `<polygon points="${W-mR+3},${lineY} ${W-mR-9},${lineY-5} ${W-mR-9},${lineY+5}" fill="#374151"/>`;
  s += `<polygon points="${mL-3},${lineY} ${mL+9},${lineY-5} ${mL+9},${lineY+5}" fill="#374151"/>`;

  for (let v = mn; v <= mx; v++) {
    const x = v2x(v);
    const major = v % labelEvery === 0;
    const th = major ? 13 : 6;
    s += `<line x1="${+x.toFixed(1)}" y1="${lineY - th/2}" x2="${+x.toFixed(1)}" y2="${lineY + th/2}" stroke="#374151" stroke-width="${major ? 2 : 1}"/>`;
    if (major) s += `<text x="${+x.toFixed(1)}" y="${lineY + 26}" text-anchor="middle" font-size="12" font-family="monospace" font-weight="600" fill="#374151">${v}</text>`;
    if (v === 0) s += `<circle cx="${+x.toFixed(1)}" cy="${lineY}" r="4" fill="#374151"/>`;
  }
  s += '</svg>';

  const old = lsc.querySelector(':scope > svg');
  if (old) old.remove();
  lsc.insertAdjacentHTML('afterbegin', s);

  // reposition already-placed cards
  st.cards.filter(c => c.placed && c.ok !== false).forEach(c => positionCard(c.id));
}

function v2x(v) { return lm.mL + (v - lm.mn) * lm.upx; }
function x2v(x) { return Math.round((x - lm.mL) / lm.upx + lm.mn); }

/* ── POOL ── */
function renderPool() {
  const pool = document.getElementById('pool');
  pool.querySelectorAll('.mc').forEach(e => e.remove());
  st.cards.forEach(c => {
    if (!c.placed || c.ok === false) pool.appendChild(buildCard(c));
  });
}

/* ── BUILD CARD ELEMENT ── */
function buildCard(c) {
  const el = document.createElement('div');
  el.className = 'mc'; el.dataset.id = c.id;
  el.innerHTML = cardHTML(c);
  if (c.ok === true) el.classList.add('ok', 'locked');
  else if (c.ok === false) el.classList.add('ko');

  if (cfg.hint && c.ok !== true) {
    const hb = document.createElement('button');
    hb.className = 'hb'; hb.textContent = '?';
    hb.onclick = e => { e.stopPropagation(); doHint(c.id, el); };
    el.appendChild(hb);
  }
  if (c.ok !== true) setupDrag(el, c.id);
  return el;
}

/* ── POSITION ON LINE ── */
function positionCard(id) {
  const c = st.cards.find(x => x.id === id);
  if (!c || c.at === null) return;
  const lsc = document.getElementById('lsc');

  let el = lsc.querySelector(`.mc[data-id="${id}"]`);
  if (!el) { el = buildCard(c); lsc.appendChild(el); }

  el.classList.add('placed');
  el.style.position = 'absolute';

  const x = v2x(c.at);
  const cardW = el.offsetWidth;
  const cardH = el.offsetHeight;
  const gap = 14;
  const baseBot = lm.H - lm.lineY + gap;
  const laneStep = cardH + 10;
  const myL = x - cardW / 2, myR = myL + cardW;

  // Find the lowest lane with no horizontal overlap
  let lane = 0;
  for (; lane < 6; lane++) {
    const bot = baseBot + lane * laneStep;
    const conflict = [...lsc.querySelectorAll(`.mc.placed[data-id]:not([data-id="${id}"])`)].some(o => {
      if (Math.abs(parseFloat(o.style.bottom) - bot) > laneStep / 2) return false;
      const oL = parseFloat(o.style.left), oR = oL + o.offsetWidth;
      return myL < oR + 4 && myR > oL - 4;
    });
    if (!conflict) break;
  }

  const cardBot = baseBot + lane * laneStep;
  el.style.bottom = cardBot + 'px';
  el.style.left   = (x - cardW / 2) + 'px';

  // Connector line from card bottom to graduation mark
  el.querySelector('.mc-conn')?.remove();
  const conn = document.createElement('div');
  conn.className = 'mc-conn';
  conn.style.height = (cardBot - (lm.H - lm.lineY)) + 'px';
  el.appendChild(conn);
}

/* ── HINT ── */
function doHint(id, el) {
  const c = st.cards.find(x => x.id === id);
  if (!c) return;
  c.hints++; st.hints++;
  const ho = document.createElement('div'); ho.className = 'ho';
  ho.textContent = c.val;
  el.appendChild(ho);
  setTimeout(() => ho.remove(), 2500);
}

/* ══════════════════════════════════════════
   DRAG & DROP  — Pointer Events
══════════════════════════════════════════ */
function setupDrag(el, id) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); startDrag(e, id, el); });
}

function startDrag(e, id, orig) {
  const rect = orig.getBoundingClientRect();
  const ox = e.clientX - rect.left, oy = e.clientY - rect.top;

  const ghost = orig.cloneNode(true);
  Object.assign(ghost.style, {
    position:'fixed', pointerEvents:'none', zIndex:'9999',
    opacity:'.88', transition:'none',
    width: rect.width + 'px', height: rect.height + 'px',
    left: rect.left + 'px', top: rect.top + 'px'
  });
  document.body.appendChild(ghost);
  orig.style.opacity = '.25';

  const lsc = document.getElementById('lsc');

  function move(ev) {
    ghost.style.left = (ev.clientX - ox) + 'px';
    ghost.style.top  = (ev.clientY - oy) + 'px';
    const r = lsc.getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
      const sv = Math.max(lm.mn, Math.min(lm.mx, x2v(ev.clientX - r.left)));
      showDI(sv);
    } else { hideDI(); }
  }

  function up(ev) {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    ghost.remove(); orig.style.opacity = '';
    hideDI();
    const r = lsc.getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
      const sv = Math.max(lm.mn, Math.min(lm.mx, x2v(ev.clientX - r.left)));
      dropCard(id, sv);
    } else {
      returnToPool(id);
    }
  }

  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

function showDI(v) {
  const di = document.getElementById('di');
  const x = v2x(v);
  di.style.display = 'block';
  di.style.left   = x + 'px';
  di.style.top    = '8px';
  di.style.height = (lm.lineY - 12) + 'px';
}
function hideDI() { document.getElementById('di').style.display = 'none'; }

function dropCard(id, val) {
  const c = st.cards.find(x => x.id === id);
  if (!c) return;
  // Remove from wherever it was
  document.querySelectorAll(`.mc[data-id="${id}"]`).forEach(e => e.remove());
  c.placed = true; c.at = val; c.ok = null;
  positionCard(id);
  if (!cfg.validate) silentCheck();
}

function returnToPool(id) {
  const c = st.cards.find(x => x.id === id);
  if (!c || c.ok === true) return;
  document.querySelectorAll(`.mc[data-id="${id}"]`).forEach(e => e.remove());
  c.placed = false; c.at = null; c.ok = null;
  document.getElementById('pool').appendChild(buildCard(c));
}

/* ══════════════════════════════════════════
   VALIDATION
══════════════════════════════════════════ */
function validate() {
  st.valCount++;
  let allOk = true;

  st.cards.forEach(c => {
    if (c.ok === true) return;
    const el = document.querySelector(`#lsc .mc[data-id="${c.id}"]`);
    if (!c.placed || !el) { allOk = false; return; }

    if (c.at === c.val) {
      c.ok = true;
      el.classList.remove('ko'); el.classList.add('ok', 'locked');
      el.querySelector('.hb')?.remove();
      el.style.pointerEvents = 'none';
    } else {
      c.ok = false; allOk = false;
      el.classList.add('ko');
      setTimeout(() => returnToPool(c.id), 1100);
    }
  });

  if (allOk) finishActivity();
}

function silentCheck() {
  const allOk = st.cards.every(c => c.placed && c.at === c.val);
  if (!allOk) return;
  st.cards.forEach(c => {
    c.ok = true;
    const el = document.querySelector(`#lsc .mc[data-id="${c.id}"]`);
    if (el) { el.classList.add('ok', 'locked'); el.querySelector('.hb')?.remove(); el.style.pointerEvents = 'none'; }
  });
  finishActivity();
}

function finishActivity() {
  if (st.done) return;
  st.done = true;
  clearInterval(ival);
  document.getElementById('btn-fin').style.display = 'inline-block';
  document.getElementById('btn-val').style.display = 'none';
}

async function saveSession() {

    const { error } = await _sb.from('sessions_atelier_maya').insert([{
      session_code: cfg.sessionCode || '',
      duration_sec: st.sec,
      val_count:    st.valCount,
      hints:        st.hints,
      card_count:   st.cards.length,
      mode:         cfg.shared ? 'partagé' : 'solo',
      cards:        st.cards.map(c => ({ expr: c.expr, val: c.val })),
      success:      st.cards.every(c => c.ok === true)
    }]);
